<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iMAX Funded | Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #c9a227; --gold-light: #e0bc5a;
      --black: #08070a; --surface: #0e0c10; --surface2: #131118;
      --border: #1e1b26; --border-gold: rgba(201,162,39,0.35);
      --text: #f0ece0; --text-muted: #7a7060; --text-dim: #3a3428;
      --red: #e74c3c;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'DM Sans', sans-serif;
    }
    body {
      font-family: var(--font-body); background: var(--black); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; opacity: 0.5;
    }

    .wrapper { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 24px; }

    .logo { font-family: var(--font-display); font-size: 24px; font-weight: 600; color: var(--gold); text-align: center; margin-bottom: 36px; }
    .logo em { color: var(--text); font-style: normal; font-weight: 400; }

    .card {
      background: var(--surface); border: 0.5px solid var(--border-gold);
      border-radius: 14px; padding: 40px 40px;
      animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

    .card-title { font-family: var(--font-display); font-size: 28px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    .card-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 32px; }
    .card-sub a { color: var(--gold); text-decoration: none; }

    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .field input {
      width: 100%; background: var(--black); border: 0.5px solid var(--border);
      border-radius: 6px; padding: 13px 14px; font-size: 14px; color: var(--text);
      font-family: var(--font-body); outline: none; transition: border-color 0.2s;
    }
    .field input::placeholder { color: var(--text-dim); }
    .field input:focus { border-color: var(--border-gold); }

    .field-footer { display: flex; justify-content: flex-end; margin-top: 6px; }
    .field-footer a { font-size: 12px; color: var(--text-muted); text-decoration: none; }
    .field-footer a:hover { color: var(--gold); }

    .error-msg {
      background: rgba(231,76,60,0.08); border: 0.5px solid rgba(231,76,60,0.3);
      border-radius: 6px; padding: 10px 14px; margin-bottom: 16px;
      font-size: 13px; color: var(--red); display: none;
    }

    .btn-login {
      width: 100%; padding: 14px;
      background: var(--gold); color: var(--black);
      border: none; border-radius: 6px; font-size: 14px; font-weight: 500;
      font-family: var(--font-body); cursor: pointer; letter-spacing: 0.3px;
      transition: background 0.2s, transform 0.15s; margin-bottom: 16px;
    }
    .btn-login:hover { background: var(--gold-light); transform: translateY(-1px); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .divider { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 0.5px; background: var(--border); }
    .divider span { font-size: 11px; color: var(--text-dim); }

    .btn-google {
      width: 100%; padding: 12px;
      background: transparent; color: var(--text-muted);
      border: 0.5px solid var(--border); border-radius: 6px;
      font-size: 13px; font-family: var(--font-body);
      cursor: pointer; transition: border-color 0.2s, color 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-google:hover { border-color: var(--border-gold); color: var(--text); }

    /* Demo credentials hint */
    .demo-hint {
      margin-top: 24px; padding: 12px 16px;
      background: rgba(201,162,39,0.06); border: 0.5px solid var(--border);
      border-radius: 8px; font-size: 12px; color: var(--text-muted); line-height: 1.7;
    }
    .demo-hint strong { color: var(--gold); font-weight: 500; }
    .demo-hint .fill-demo { color: var(--gold); cursor: pointer; text-decoration: underline; text-decoration-color: var(--border-gold); font-size: 11px; }
    .demo-hint .fill-demo:hover { color: var(--gold-light); }

    .back-link { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-dim); }
    .back-link a { color: var(--text-muted); text-decoration: none; }
    .back-link a:hover { color: var(--gold); }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="logo">iMAX <em>Funded</em></div>

  <div class="card">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">No account yet? <a href="signup.html">Create one free</a></div>

    <div class="error-msg" id="errorMsg">Invalid email or password. Please try again.</div>

    <div class="field">
      <label>Email address</label>
      <input type="email" id="loginEmail" placeholder="kwame@example.com" />
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Your password" />
      <div class="field-footer"><a href="#">Forgot password?</a></div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="handleLogin()">Sign in to dashboard</button>

    <div class="divider"><span>or</span></div>

    <button class="btn-google" onclick="handleLogin()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </button>

    <div class="demo-hint">
      <strong>Prototype demo</strong> — use any email + password (8+ chars) to sign in,
      or <span class="fill-demo" onclick="fillDemo()">fill demo credentials</span>.
    </div>
  </div>

  <div class="back-link"><a href="index.html">← Back to iMAX Funded</a></div>
</div>

<script>
  function fillDemo() {
    document.getElementById('loginEmail').value = 'kwame@example.com';
    document.getElementById('loginPassword').value = 'trader123';
  }

  function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';

    if (!email || !email.includes('@') || password.length < 6) {
      errorMsg.style.display = 'block';
      return;
    }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    /*
      REAL INTEGRATION (Supabase):
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) { show error, re-enable button }
      else { redirect to dashboard }
    */

    // Prototype: simulate auth delay
    setTimeout(() => {
      sessionStorage.setItem('imax_email', email);
      window.location.href = 'dashboard.html';
    }, 900);
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
